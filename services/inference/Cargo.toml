[package]
name = "inference-engine"
version = "0.1.0"
edition = "2021"
description = "High-performance ONNX Runtime inference engine for code anomaly detection"

[[bin]]
name = "inference-server"
path = "src/main.rs"

[dependencies]
# gRPC
tonic = "0.12"
prost = "0.14"

# ONNX Runtime
ort = { version = "2.0.0-rc.13", features = ["load-dynamic"] }

# HuggingFace tokenizers
tokenizers = "0.20"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Metrics
metrics = "0.23"
metrics-exporter-prometheus = "0.15"

# Utilities
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ndarray = "0.16"

[build-dependencies]
tonic-build = "0.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
