[project]
name = "code-anomaly-ml"
version = "0.1.0"
description = "Training pipeline for CodeBERT-based code defect detection"
requires-python = ">=3.10"

dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "datasets>=2.19.0",
    "tokenizers>=0.19.0",
    "onnx>=1.16.0",
    "onnxruntime>=1.18.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.setuptools]
py-modules = []
